<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZüriGlanz Mobile Detailing · 8048 Zürich</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState('');
            const OWNER_PIN = '8000';

            const handlePinLogin = (e) => {
                e.preventDefault();
                if (pinInput.trim() === OWNER_PIN) {
                    setIsAdminMode(true);
                    setShowPinModal(false);
                    setPinInput('');
                    setPinError('');
                } else {
                    setPinError('Невірний PIN (Демо PIN: 8000)');
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900">
                    {/* MODAL PIN */}
                    {showPinModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                <h3 className="font-bold text-lg text-slate-900">🔒 Вхід для власника ZüriGlanz</h3>
                                <p className="text-xs text-slate-600">Введіть PIN-код (демо: 8000):</p>
                                <form onSubmit={handlePinLogin} className="space-y-3">
                                    <input 
                                        type="password" 
                                        inputMode="numeric" 
                                        autoFocus
                                        value={pinInput} 
                                        onChange={(e) => setPinInput(e.target.value)}
                                        placeholder="PIN (8000)"
                                        className="w-full px-4 py-3 text-center tracking-widest text-lg font-bold rounded-xl border border-slate-300 focus:outline-none focus:border-slate-900"
                                    />
                                    {pinError && <p className="text-xs text-red-600 font-semibold">{pinError}</p>}
                                    <button type="submit" className="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">Увійти</button>
                                </form>
                                <button onClick={() => setShowPinModal(false)} className="w-full text-xs text-slate-500 hover:text-slate-800 pt-1">Закрити</button>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold">✨</div>
                                <div>
                                    <span className="font-bold text-lg text-slate-900">ZüriGlanz</span>
                                    <span className="text-[11px] font-semibold uppercase tracking-wider block text-slate-500">8048 Zürich + 30 км</span>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowPinModal(true)}
                                className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white hover:bg-slate-800 transition"
                            >
                                {isAdminMode ? 'Адмін-панель активна' : 'Inhaber-Login (Адмін)'}
                            </button>
                        </div>
                    </header>

                    {/* MAIN HERO */}
                    <main className="max-w-4xl mx-auto px-4 py-16 text-center space-y-6">
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">
                            🌿 Швейцарська еко-технологія (Waterless) · Виїзд на вашу парковку
                        </div>
                        <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900">
                            Мобільний деталінг авто у Цюриху
                        </h1>
                        <p className="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto">
                            Професійна 4–5 годинна чистка та захист кузова/салону прямо біля вашого будинку чи офісу в радіусі 30 км від 8048 Zürich.
                        </p>

                        {isAdminMode ? (
                            <div className="p-6 rounded-2xl bg-slate-900 text-white text-left space-y-4 mt-8 shadow-xl">
                                <h2 className="text-xl font-bold text-emerald-400">Панель керування замовленнями (Адмін)</h2>
                                <p className="text-xs text-slate-300">База даних Supabase підключена успішно. Тут відображатимуться всі вхідні заявки від клієнтів з калькулятора.</p>
                                <div className="p-4 rounded-xl bg-slate-800 border border-slate-700 text-sm text-slate-300">
                                    Поки що нових заявок немає. Можете відкрити головну сторінку та протестувати форму замовлення!
                                </div>
                            </div>
                        ) : (
                            <div className="p-8 rounded-3xl bg-white border border-slate-200 shadow-xl space-y-6 max-w-xl mx-auto text-left">
                                <h3 className="text-xl font-bold text-slate-900 text-center">Записатися на обслуговування</h3>
                                <p className="text-xs text-slate-500 text-center">Базова пашала від 150 CHF (включно з виїздом у межах 30 км).</p>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Марка та модель авто:</label>
                                        <input type="text" placeholder="напр. Tesla Model Y, BMW X3" className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-slate-900" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Ваша адреса у Цюриху або околицях:</label>
                                        <input type="text" placeholder="напр. Badenerstrasse 690, 8048 Zürich" className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-slate-900" />
                                    </div>
                                    <button onClick={() => alert('Форма працює! Підключіть повний скрипт для активації кроків.')} className="w-full py-4 rounded-xl bg-[#D52B1E] hover:bg-red-700 text-white font-bold text-sm shadow-lg shadow-red-950/30 transition">
                                        Розрахувати та обрати час
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
